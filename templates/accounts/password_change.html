
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | LifeFlow</title>
    <style>
        body { font-family: Arial; background: #fff0f2; padding: 35px; }
        .card { max-width: 480px; margin: 30px auto; padding: 30px; background: white; border-radius: 14px; }
        input { width: 100%; padding: 11px; margin: 8px 0 16px; box-sizing: border-box; }
        button { background: #bd263f; color: white; border: 0; padding: 12px 20px; border-radius: 7px; cursor: pointer; }
        h2 { color: #bd263f; }
        .errorlist { color: #bd263f; }
    </style>
</head>
<body>
<div class="card">
    <h2>Change Password</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Password</button>
    </form>
    <p><a href="{% url 'donor_dashboard' %}">Back to Dashboard</a></p>
</div>
</body>
</html>
